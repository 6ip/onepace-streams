name: Probe release sources

# Temporary. Run it once from the Actions tab, read the three status codes,
# then delete this file.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which sources answer from a GitHub runner
        run: |
          probe() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' -A "Mozilla/5.0" "$1")
            size=$(wc -c < /tmp/body)
            echo "  $code  ${size} bytes  $1"
          }
          echo "--- onepace.net ---"
          probe "https://onepace.net/en/releases"
          probe "https://onepace.net/en/releases/rss.xml"
          echo "--- nyaa.si ---"
          probe "https://nyaa.si/?page=rss&q=%5BOne+Pace%5D&c=0_0&f=0"
          echo
          echo "--- if anything returned 403, what does the block say ---"
          curl -s -A "Mozilla/5.0" "https://onepace.net/en/releases/rss.xml" | head -c 300
