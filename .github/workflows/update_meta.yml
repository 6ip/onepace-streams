name: Update One Pace Meta

on:
  schedule:
    - cron: '30 */6 * * *' # Runs at minute 30 past every 6th hour 
  workflow_dispatch: # Adds the button to run it manually!

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to push code back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pysubs2 requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Metadata and Subtitle Scripts
        run: |
          python -u epis.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all changes (JSONs, VTTs, and Hash memory)
          git add .
          
          # Commit, pull the newest changes, and push!
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated One Pace metadata" && git pull --rebase origin main && git push)
