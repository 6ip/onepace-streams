name: Update One Pace Data

on:
  schedule:
    - cron: '30 */3 * * *' # Runs at minute 30 past every 3rd hour
  workflow_dispatch: # Button for manual runs

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bencode.py
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build streams
        run: python -u scr.py

      # Reuses the spreadsheet scr.py just downloaded instead of fetching it twice.
      - name: Build metadata
        run: python -u epis.py --reuse-spreadsheet

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add stream/ meta/ tracker.json

          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          # A failed report must never block the commit.
          python -u report.py > /tmp/commit_msg.txt || echo "[auto] data refreshed" > /tmp/commit_msg.txt
          cat /tmp/commit_msg.txt

          git commit -F /tmp/commit_msg.txt
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Only the files the addon reads through jsDelivr; streams come from github.io.
      # Must run after the push, or jsDelivr just re-caches the old copy.
      - name: Purge jsDelivr
        if: steps.commit.outputs.pushed == 'true'
        run: |
          for f in config.json \
                   catalog/seriesCatalog.json \
                   meta/pp_onepacee.json \
                   meta/pp_muhnpace.json \
                   meta/pp_onipace.json \
                   meta/pp_KUMA_SHAVED.json; do
            curl -s "https://purge.jsdelivr.net/gh/6ip/onepace-streams@main/$f" > /dev/null
            echo " - Purged $f"
            sleep 1
          done
